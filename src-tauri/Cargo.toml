[package]
name = "xi-zone-editor"
version = "1.0.0"
description = "XI Zone Editor — FFXI zone level editor, WebGL + Tauri"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
once_cell = "1"

[profile.release]
strip = true
lto = true
